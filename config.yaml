# Default Collector config for claude-otel-collector.
# Pipeline: OTLP/HTTP in (port via CLAUDE_OTEL_OTLP_HTTP_PORT,
# default 4318 — BR-OTEL-007) → enrichment + batch → file out
# (output/telemetry.jsonl, OTLP/JSON one-line-per-request).
# The OTLP port is set by the spawning .NET sidecar from the
# typed option Otel:CollectorOtlpPort and exported as the env
# var below; do NOT edit the literal :4318 default here. To
# re-port locally, edit src/HelpersSidecar/appsettings.Local.json.

extensions:
  enrichmentctl:
    endpoint: 127.0.0.1:13133
    persistent_file: persistent-enrichments.json
  health_check:
    endpoint: 127.0.0.1:13134

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:CLAUDE_OTEL_OTLP_HTTP_PORT:-4318}

processors:
  enrichment:
    extension: enrichmentctl
  batch:
    timeout: 200ms

exporters:
  file:
    path: ./output/telemetry.jsonl
    format: json
  # Opt-in: add `otlphttp` to a pipeline's exporters list to also
  # forward enriched OTLP to a downstream backend (e.g. Honeycomb,
  # Tempo, Datadog).
  otlphttp:
    endpoint: http://localhost:4319

service:
  extensions: [enrichmentctl, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [enrichment, batch]
      exporters: [file]
    logs:
      receivers: [otlp]
      processors: [enrichment, batch]
      exporters: [file]
    metrics:
      receivers: [otlp]
      processors: [enrichment, batch]
      exporters: [file]
