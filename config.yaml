# Default Collector config for claude-otel-collector.
# Pipeline: OTLP/HTTP in → enrichment + batch → file out
# (output/telemetry.jsonl, OTLP/JSON one-line-per-request).
#
# Per BR-OTEL-007, every port below is sourced from the .NET
# sidecar's CollectorOptions typed class. The sidecar exports
# the four CLAUDE_OTEL_*_PORT env vars on the spawned collector
# process; OTel Collector substitutes them at startup via
# ${env:NAME:-default}. Do NOT edit the literal defaults below.
# To re-port locally, edit src/HelpersSidecar/appsettings.Local.json.

extensions:
  enrichmentctl:
    endpoint: ${env:CLAUDE_OTEL_HOST:-127.0.0.1}:${env:CLAUDE_OTEL_CONTROL_PORT:-13133}
    persistent_file: persistent-enrichments.json
  health_check:
    endpoint: ${env:CLAUDE_OTEL_HOST:-127.0.0.1}:${env:CLAUDE_OTEL_HEALTHZ_PORT:-13134}

receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:CLAUDE_OTEL_HOST:-127.0.0.1}:${env:CLAUDE_OTEL_OTLP_HTTP_PORT:-4318}

processors:
  enrichment:
    extension: enrichmentctl
  batch:
    timeout: 200ms

exporters:
  file:
    path: ./output/telemetry.jsonl
    format: json
  # Opt-in: add `otlphttp` to a pipeline's exporters list to also
  # forward enriched OTLP to a downstream backend (e.g. Honeycomb,
  # Tempo, Datadog).
  otlphttp:
    endpoint: ${env:CLAUDE_OTEL_DOWNSTREAM_SCHEME:-http}://${env:CLAUDE_OTEL_DOWNSTREAM_HOST:-localhost}:${env:CLAUDE_OTEL_DOWNSTREAM_OTLP_PORT:-4319}

service:
  extensions: [enrichmentctl, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [enrichment, batch]
      exporters: [file]
    logs:
      receivers: [otlp]
      processors: [enrichment, batch]
      exporters: [file]
    metrics:
      receivers: [otlp]
      processors: [enrichment, batch]
      exporters: [file]
